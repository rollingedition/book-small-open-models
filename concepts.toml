example = "monthly-bill-from-labelled-inputs"

[concepts.relations]
contrasts-with = ["hosted-bill"]

[[concepts]]
id = "machine-capacity"
term = "machine capacity"
aliases = ["machine capacity per month", "capacity"]
definition = "The number of messages a machine can route in a month is its throughput, in messages per second, times the seconds in a month, times its utilisation"
formula = "machine capacity per month = messages per second × seconds per month × utilisation"
section = "count-the-bill-and-the-machine"
example = "monthly-bill-from-labelled-inputs"

[[concepts]]
id = "utilisation"
term = "utilisation"
aliases = ["utilization"]
definition = "utilisation, which is the share of the month it is busy"
section = "count-the-bill-and-the-machine"
example = "monthly-bill-from-labelled-inputs"

[concepts.relations]
part-of = ["machine-capacity"]

[[concepts]]
id = "machine-cost-per-message"
term = "machine cost per message"
