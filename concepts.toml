[[concepts]]
id = "inbox"
term = "inbox"
context = "message-routing"
definition = "Customer messages to a bank land in one support queue, which this book calls the inbox."
section = "route-a-message"

[[concepts]]
id = "router"
term = "router"
context = "message-routing"
definition = "The router is the whole system: a model, a prompt, a threshold and the code that sends a message on."
section = "route-a-message"

[[concepts]]
