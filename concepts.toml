example = "monthly-bill-from-labelled-inputs"

[concepts.relations]
computed-from = ["machine-bill", "machine-capacity"]

[[concepts]]
id = "break-even"
term = "break-even"
definition = "The break-even is the volume at which the hosted model's monthly bill and the machine's are equal."
formula = "break-even messages per month = machine bill per month ÷ hosted price per message"
