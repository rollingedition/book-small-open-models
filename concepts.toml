[[concepts]]
id = "hosted-bill"
term = "hosted bill"
definition = "A hosted model's monthly bill is the number of messages times what one message costs, and one message costs its input tokens at the input price plus its output tokens at the output price."
formula = "hosted cost per month = messages × (input tokens × input price + output tokens × output price)"
section = "count-the-bill-and-the-machine"
example = "monthly-bill-from-labelled-inputs"

[[concepts]]
id = "machine-bill"
term = "machine bill"
definition = "A machine's monthly bill is its hours times its hourly rate."
formula = "machine cost per month = hours × machine cost per hour"
