# Spoken descriptions for chapter 9 (audio.md, "Spoken descriptions"). Code and output are never read aloud.

[examples.adapter-manifest-check]
say = "The example reads the recorded adapter's manifest and checks it before any route loads the adapter. It prints the adapter's name, {{out:adapter-manifest-check:adapter}}, whether the base revision in the manifest is the pinned one, {{out:adapter-manifest-check:base revision matches pin}}, and whether the manifest's own digest matches its pin, {{out:adapter-manifest-check:manifest matches pin}}. It then counts the settings and files that match: {{out:adapter-manifest-check:settings matching}} settings and {{out:adapter-manifest-check:files matching}} files. Next it edits two copies. The first has its threshold changed to zero, and its line reads: {{out:adapter-manifest-check:threshold copy}}. The second has one extra key in its config, and its line reads: {{out:adapter-manifest-check:extra-key copy}}. The make_app check refuses both copies before a model loads. Last, PEFT loads the second copy, and the example counts the warnings that name the extra key, {{out:adapter-manifest-check:warnings naming the extra key while PEFT loads the copy}}, and prints that warning's type and its first sentence, which says the unexpected keyword is ignored."

[examples.handoff-windows]
say = "The example routes four windows of {{out:handoff-windows:week 1 messages}} messages each, and compares each window's hand-off rate with the dev baseline, {{out:handoff-windows:dev hand-off rate (baseline)}}. The first two windows are the sample's first messages, in sample order. The last two are a replay, which the output labels: {{out:handoff-windows:weeks 3 and 4}}. For each window it prints the count of hand-offs, the drift flag, the lowest confidence and how many of the messages kept were right. Week 4 hands off {{out:handoff-windows:week 4 handed off}}, so its rate drifts, and its lowest confidence is {{out:handoff-windows:week 4 lowest confidence}}, above the threshold. Every message it kept was right: {{out:handoff-windows:week 4 right among messages not handed off}}."

[examples.fallback-to-larger-model]
say = "The example takes the handed-off messages from the first two windows. The router hands off {{out:fallback-to-larger-model:handed off by the router}}. Each one goes to a person, {{out:fallback-to-larger-model:sent to a person}}, and {{out:fallback-to-larger-model:suggestions attached}} of them carry the larger model's recorded answer as a labelled suggestion. The suggestions are right on {{out:fallback-to-larger-model:suggestions right}}. No team is returned for a handed-off message: {{out:fallback-to-larger-model:team returned for a handed-off message}}."

[examples.retrain-trigger]
say = "The example applies the drift rule to the four windows, in order, and counts the windows that drift: {{out:retrain-trigger:weeks drifting}}. The rule says to retrain when two consecutive windows drift. The longest run here is {{out:retrain-trigger:longest run of drifting weeks}} windows, so the trigger {{out:retrain-trigger:retrain trigger}}. Both drifting windows are the replay, so the output shows how the rule behaves, and it does not show what the inbox did."
