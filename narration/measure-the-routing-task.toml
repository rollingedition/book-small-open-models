# Spoken descriptions for chapter 2 (audio.md, "Spoken descriptions"). Code and output are never read aloud.

[examples.count-the-splits]
say = "The code reads the training file, the test file and the dev sample, and runs no model. It counts the messages in each split and the messages for each team. The training file holds {{out:count-the-splits:train rows}} messages, the dev sample holds {{out:count-the-splits:dev rows}} of them, and the test file holds {{out:count-the-splits:test rows}} messages across {{out:count-the-splits:labels}} teams. It then gives the fewest and the most messages for a team in each split, and for the test sample. In the test file the fewest is {{out:count-the-splits:test per label min}} and the most is {{out:count-the-splits:test per label max}}. In the training file the fewest is {{out:count-the-splits:train per label min}} and the most is {{out:count-the-splits:train per label max}}, a spread that is wide. The test sample has {{out:count-the-splits:test_1001 per label min}} messages at its fewest for a team and {{out:count-the-splits:test_1001 per label max}} at its most."

[examples.confusions-in-the-baseline]
say = "The code checks the stand-in's recorded answers against their manifest, and checks that they cover exactly the test sample of {{out:confusions-in-the-baseline:messages}} messages. It then counts the answers that name the wrong team, and the three pairs of gold team and wrong answer that occur most often. The output gives {{out:confusions-in-the-baseline:messages}} messages and {{out:confusions-in-the-baseline:wrong answers}} wrong answers, a wrong rate of {{out:confusions-in-the-baseline:wrong rate}}. Then come the three pairs, most frequent first, each with its count, its gold team, the team the stand-in answered with, and how many of that gold team's sample messages the pair takes. The first pair occurs {{out:confusions-in-the-baseline:pair 1 count}} times: gold team {{out:confusions-in-the-baseline:pair 1 gold}}, answered {{out:confusions-in-the-baseline:pair 1 answer}}, which is {{out:confusions-in-the-baseline:pair 1 of gold team}} of that team's messages. The second occurs {{out:confusions-in-the-baseline:pair 2 count}} times: gold team {{out:confusions-in-the-baseline:pair 2 gold}}, answered {{out:confusions-in-the-baseline:pair 2 answer}}, {{out:confusions-in-the-baseline:pair 2 of gold team}}. The third occurs {{out:confusions-in-the-baseline:pair 3 count}} times: gold team {{out:confusions-in-the-baseline:pair 3 gold}}, answered {{out:confusions-in-the-baseline:pair 3 answer}}, {{out:confusions-in-the-baseline:pair 3 of gold team}}. Last, the code lists the teams that the recording never names as an answer, sorted by name. It gives {{out:confusions-in-the-baseline:teams never answered}} such teams. For each it prints the sample count and the wrong answer the team most often receives."

[examples.baseline-measures]
say = "The code checks the recorded answers against their manifest, then scores them on the test sample of {{out:baseline-measures:messages}} messages with the three measures. It runs no model. It uses the placeholder threshold of 0.5 that chapter 1 uses, and its confidence is the probability that llama-cpp-python returns for the constrained answer, the exponential of the recorded log-probability. At that threshold the accuracy is {{out:baseline-measures:accuracy}}, the hand-off rate is {{out:baseline-measures:handed off}}, and the accuracy on messages not handed off is {{out:baseline-measures:accuracy on messages not handed off}}. The code then applies a threshold above every confidence, which hands off every message. It prints the hand-off count, {{out:baseline-measures:handed off at that threshold}}, and the accuracy on messages not handed off at that threshold, which is {{out:baseline-measures:accuracy on messages not handed off at that threshold}}."

[[tables]]
section = "three-measures-each-with-its-denominator"
starts = "| Measure | Counts |"
say = "A table of the three measures, one per row. For each it gives what is counted on top and what the count is divided by underneath. Accuracy counts the messages whose team is right, out of all messages. The hand-off rate counts the messages below the threshold, out of all messages. Accuracy on the messages not handed off counts the correct ones among the messages not handed off, out of those messages."
