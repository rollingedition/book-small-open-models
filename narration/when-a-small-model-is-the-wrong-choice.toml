# Spoken descriptions for chapter 10 (audio.md, "Spoken descriptions"). Code and output are never read aloud.

[examples.router-on-test-1001]
say = "The example puts the router and the stand-in side by side on all one thousand and one messages of the committed test order, test_1001. It prints how many each gets right: the router {{out:router-on-test-1001:router banking77-lora-v1 correct}}, and the stand-in {{out:router-on-test-1001:stand-in correct}}, which is the baseline from chapter 2. It then counts the messages the stand-in gets right and the router gets wrong, {{out:router-on-test-1001:right for the stand-in, wrong for the router}}, and how many of those the router hands off. Last, it counts the wrong answers the router sends to a caller, {{out:router-on-test-1001:wrong for the router and sent as an answer}}."

[examples.where-the-router-still-loses]
say = "The example puts the router and the stand-in side by side on the first two hundred messages of the committed test order, test_200. It prints how many each gets right: the router {{out:where-the-router-still-loses:router banking77-lora-v1 correct}}, and the stand-in {{out:where-the-router-still-loses:stand-in correct}}. It then counts the messages the stand-in gets right and the router gets wrong, {{out:where-the-router-still-loses:right for the stand-in, wrong for the router}}, and how many of those the router hands off. Last, it counts the wrong answers the router sends to a caller, {{out:where-the-router-still-loses:wrong for the router and sent as an answer}}."

[examples.cost-ratio-from-recording]
say = "The example reads the recorded throughput rates and ratios and the machine they were measured on, and no model runs. It prints the machine's name and its thread count, then each copy's rate in messages a second. The stand-in routes {{out:cost-ratio-from-recording:stand-in rate, one per call (messages a second)}} messages a second, one message per call, and the float32 classifier routes {{out:cost-ratio-from-recording:classifier fp32 rate, one per call (messages a second)}}. In batches of sixteen, the float32 classifier routes {{out:cost-ratio-from-recording:classifier fp32 rate, batches of 16 (messages a second)}}. The one-per-call ratio, {{out:cost-ratio-from-recording:fp32 over stand-in, one per call, throughput ratio}}, is the like-for-like comparison. The batched ratio, {{out:cost-ratio-from-recording:fp32 over stand-in, batches of 16, throughput ratio}}, is not, because the batches change the work per call. The int8 copy over float32, in batches, is {{out:cost-ratio-from-recording:int8 over fp32, batches of 16, throughput ratio}}, so it is no faster on this machine."

[examples.monthly-bill-from-labelled-inputs]
say = "The example works out a monthly bill from inputs the reader sets. The prices, the volume, the machine's cost per hour and its utilisation are example values. The router's rate is the one-per-call rate recorded on the machine. The input tokens per message are counted live with a tokenizer, at {{out:monthly-bill-from-labelled-inputs:input tokens per message, hosted prompt (counted with SmolLM2-135M-Instruct, a stand-in tokenizer)}}. The example then prints the hosted bill per month, {{out:monthly-bill-from-labelled-inputs:example hosted bill per month (example prices), USD}} U S dollars, and the machine's bill per month, {{out:monthly-bill-from-labelled-inputs:example machine bill per month (example cost per hour), USD}} U S dollars. It checks that the volume sits within the machine's capacity. Each derived line names the example values it uses. At these example values, the hosted route is the cheaper one at this volume."

[examples.break-even-from-recorded-ratio]
say = "The example finds the volume at which the machine's monthly bill equals the hosted bill. It divides the machine's bill by the hosted price per message, and it prints the result, {{out:break-even-from-recorded-ratio:example break-even messages per month (example prices and cost per hour)}} messages a month. It then checks that this count sits inside the machine's capacity, which uses the recorded one-per-call rate, {{out:break-even-from-recorded-ratio:machine capacity per month (recorded rate, example utilisation)}} messages a month. The prices and the machine's cost are the same example values as the monthly bill."

[[blocks]]
section = "count-the-bill-and-the-machine"
starts = "hosted cost per month = messages"
say = "Three formulas, one for each cost and one for capacity. The hosted cost is the messages times the sum of two products: the input tokens times the input price, and the output tokens times the output price, with both prices per token. The machine's cost is its hours times its hourly rate. The machine's capacity is its messages per second times the seconds in a month times its utilisation, the share of the month it is busy."

[[tables]]
section = "choose-with-a-table"
starts = "| Question |"
say = "A table of questions, with three columns of answers: what a small router looks like on each, what a hosted model looks like, and what to count on your own inbox. The questions are whether the messages must stay on the bank's machines, whether every answer must be a team, how often the team list changes, how many messages a month there are, how many labelled messages each team has, and whether the task needs open text or broad knowledge. The last column says which rows are requirements to decide first and which are counts."
