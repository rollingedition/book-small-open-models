# Spoken descriptions for chapter 7 (audio.md, "Spoken descriptions"). Code and output are never read aloud.

[examples.int8-layers-and-bytes]
say = "The example builds the int8 copy of the adapter's model and counts the linear layers in its backbone: {{out:int8-layers-and-bytes:backbone Linear layers}} in all, of which {{out:int8-layers-and-bytes:backbone Linear layers quantized to int8}} are quantized. The output layer stays in float32. It then counts the weights in those layers, {{out:int8-layers-and-bytes:weights in backbone Linear layers}}, and works out their bytes from their shapes alone. As int8 they take {{out:int8-layers-and-bytes:weight bytes, int8 as a share of float32}} of the float32 bytes. That is arithmetic on the shapes, not a file size or the memory a running router uses."

[examples.int8-changed-predictions]
say = "The example scores the two hundred messages of the test sample twice, once with the float32 adapter and once with its int8 copy, at the threshold in the adapter's manifest, {{out:int8-changed-predictions:handoff threshold from manifest}}. For each copy it prints the accuracy, the hand-offs and the accuracy on the messages kept. The float32 adapter gets {{out:int8-changed-predictions:float32 accuracy on test_200}} right, and the int8 copy gets {{out:int8-changed-predictions:int8 accuracy on test_200}}. The float32 adapter hands off {{out:int8-changed-predictions:float32 handed off}} messages, and the int8 copy hands off {{out:int8-changed-predictions:int8 handed off}}. The next lines count the messages whose team changes between the two copies, and the hand-off decisions that change: {{out:int8-changed-predictions:predictions changed by int8}}, and {{out:int8-changed-predictions:hand-off decisions changed by int8}}. The last line does the same for a copy that quantizes the score head too: {{out:int8-changed-predictions:predictions changed with the head in int8 too}}."
