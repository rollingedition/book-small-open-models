# Spoken descriptions for chapter 6 (audio.md, "Spoken descriptions"). Code and output are never read aloud.

[examples.teacher-agreement]
say = "The example reads the label the stand-in gave each training row it labelled, and compares it with the gold label of that row. It prints how many rows the teacher labelled, {{out:teacher-agreement:training rows labelled by the teacher}}, how many of its labels match the gold label, {{out:teacher-agreement:teacher agrees with gold on training rows}}, and how many do not, {{out:teacher-agreement:teacher disagrees with gold on training rows}}. Then it reads the stand-in's recorded answers to the two hundred test messages and prints its accuracy on them, {{out:teacher-agreement:teacher accuracy on test_200}}."

[examples.student-recorded-adapter]
say = "The example loads the distilled student and the human-labelled adapter, and scores the same two hundred test messages with each. It first chooses the student's threshold on a part of the dev messages, {{out:student-recorded-adapter:dev messages used}}. The rule asks for a threshold at which the messages kept are at least ninety percent accurate, and no threshold reaches that, so the fallback applies, and the threshold chosen is {{out:student-recorded-adapter:student threshold chosen on dev}}. The student is right on {{out:student-recorded-adapter:banking77-distilled-v1 accuracy on test_200}} messages, and hands off {{out:student-recorded-adapter:banking77-distilled-v1 handed off}}. The human-labelled adapter is right on {{out:student-recorded-adapter:banking77-lora-v1 accuracy on test_200}} messages, and hands off {{out:student-recorded-adapter:banking77-lora-v1 handed off}}. Last, it compares the student's answers with the teacher's: they are equal on {{out:student-recorded-adapter:student answers equal to teacher answers on test_200}} messages, and the student makes {{out:student-recorded-adapter:student errors on test_200}} errors, of which {{out:student-recorded-adapter:student errors equal to the teacher's answer}} repeat the teacher's answer."

[examples.student-vs-gold-control]
say = "The example scores the student and its control on the same two hundred test messages. The control is the same recipe trained on the gold labels of the same training rows. Each has its own threshold, chosen on the same part of the dev messages, and neither reaches the ninety percent target, so both use the fallback. The control's threshold is {{out:student-vs-gold-control:banking77-gold-1000-v1 threshold chosen on dev}}, a fallback chosen on very few kept messages, and it hands off {{out:student-vs-gold-control:banking77-gold-1000-v1 handed off}} of the messages. The example also prints the rows and steps of each recipe: the student and its control have {{out:student-vs-gold-control:banking77-distilled-v1 training rows}} rows and {{out:student-vs-gold-control:banking77-distilled-v1 training steps}} steps, and the human-labelled adapter has {{out:student-vs-gold-control:banking77-lora-v1 training rows}} rows and {{out:student-vs-gold-control:banking77-lora-v1 training steps}} steps. The example then counts the messages each one gets right that the other gets wrong. The control is right and the student wrong on {{out:student-vs-gold-control:test_200 messages the control gets right and the student gets wrong}} messages, and the student is right and the control wrong on {{out:student-vs-gold-control:test_200 messages the student gets right and the control gets wrong}}."
